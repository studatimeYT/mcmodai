<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Multi-Model MC AI Mod Maker</title>
    <!-- Include JSZip to bundle packages inside the browser -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left; }
        h2 { text-align: center; color: #ff6f00; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #bbb; }
        select, input[type="text"] { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        button { background-color: #ff6f00; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #e65100; }
        #status { margin-top: 20px; padding: 15px; border-radius: 4px; background: #151515; color: #aaa; font-style: italic; text-align: center; min-height: 20px; border-left: 4px solid #ff6f00; }
    </style>
</head>
<body>

<div class="container">
    <h2>⛏️ Multi-Model MC AI Mod Maker</h2>
    
    <label for="edition">1. Select Minecraft Edition:</label>
    <select id="edition">
        <option value="bedrock">Bedrock Edition (.mcaddon Addon)</option>
        <option value="java">Java Edition (Data Pack / Config Source ZIP)</option>
    </select>

    <label for="model">2. Choose AI Engine:</label>
    <select id="model">
        <option value="Qwen/Qwen2.5-Coder-32B-Instruct">Qwen 2.5 Coder 32B (Fast & High Quality Coding)</option>
        <option value="meta-llama/Llama-3.3-70B-Instruct">Llama 3.3 70B (Deep Logic & Custom Rules)</option>
    </select>

    <label for="prompt">3. Describe Your Mod Idea:</label>
    <input type="text" id="prompt" placeholder="e.g., A ruby pickaxe that creates explosions when mining diamond ore...">
    
    <button onclick="generateMinecraftMod()">Compile Mod Package</button>
    
    <div id="status">Ready to build. Enter your parameters and click compile.</div>
</div>

<script>
async function generateMinecraftMod() {
    const edition = document.getElementById('edition').value;
    const modelEndpoint = document.getElementById('model').value;
    const promptText = document.getElementById('prompt').value;
    const statusDiv = document.getElementById('status');
    
    if (!promptText) {
        statusDiv.innerText = "Please describe your mod idea first!";
        return;
    }
    
    statusDiv.innerText = `Connecting to ${modelEndpoint.split('/')[1]} text engine...`;
    
    // Dynamically adjust the system prompt instructions based on Java vs Bedrock choices
    let systemInstruction = "";
    if (edition === "bedrock") {
        systemInstruction = "You are an expert Minecraft Bedrock Add-on developer. Create an asset bundle for the user. Your output must be a single, valid JSON object containing exactly two keys: 'manifest' (the manifest.json object parameters) and 'logic_js' (the main script logic file string text). Do not include any extra conversational markdown text, descriptions, or formatting backticks.";
    } else {
        systemInstruction = "You are an expert Minecraft Java data pack generator. Create a data pack configuration setup. Your output must be a single, valid JSON object containing exactly two keys: 'pack_mcmeta' (the pack.mcmeta descriptor file) and 'function_mcfunction' (the tick/main game behavior instructions text written in raw standard minecraft commands). Do not include any chat commentary or markdown backticks.";
    }
    
    try {
        const response = await fetch(`https://huggingface.co{modelEndpoint}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                inputs: `<|system|>\n${systemInstruction}\n<|user|>\nCreate a ${edition} mod asset package for: ${promptText}\n<|assistant|>\n`,
                parameters: { max_new_tokens: 1500, return_full_text: false }
            })
        });
        
        const data = await response.json();
        
        // Error trap wrapper for rate limited model servers
        if (!data || (!data.generated_text && !Array.isArray(data))) {
            throw new Error("Model is currently warming up or overloaded on Hugging Face servers. Click submit again.");
        }
        
        let aiText = Array.isArray(data) ? data[0].generated_text : data.generated_text;
        aiText = aiText.trim();
        
        // Clean text wrappers
        if (aiText.startsWith("```json")) aiText = aiText.substring(7);
        if (aiText.startsWith("```")) aiText = aiText.substring(3);
        if (aiText.endsWith("```")) aiText = aiText.substring(0, aiText.length - 3);
        
        statusDiv.innerText = "Extracting file configurations...";
        const parsedData = JSON.parse(aiText.trim());
        
        statusDiv.innerText = "Packing assets inside browser memory...";
        const zip = new JSZip();
        let downloadName = "";
        
        // Natively assemble the correct files depending on the chosen platform edition
        if (edition === "bedrock") {
            zip.file("manifest.json", JSON.stringify(parsedData.manifest || {}, null, 4));
            zip.file("main.js", parsedData.logic_js || "// No bedrock logic generated");
            downloadName = "custom_addon.mcaddon";
        } else {
            zip.file("pack.mcmeta", JSON.stringify(parsedData.pack_mcmeta || { "pack": { "pack_format": 48, "description": "AI Generated Data Pack" } }, null, 4));
            zip.file("data/custom/functions/main.mcfunction", parsedData.function_mcfunction || "# No command logic generated");
            downloadName = "java_datapack.zip";
        }
        
        const content = await zip.generateAsync({ type: "blob" });
        
        statusDiv.innerText = "Pushing download package to browser cache...";
        const link = document.createElement("a");
        link.href = URL.createObjectURL(content);
        link.download = downloadName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        statusDiv.innerText = `Success! Cleanly packed your ${edition.toUpperCase()} mod using ${modelEndpoint.split('/')[1]}.`;
    } catch (error) {
        statusDiv.innerText = "Compilation Issue: " + error.message + ". Try clicking compile again.";
        console.error(error);
    }
}
</script>

</body>
</html>
