<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcmodai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #141312; 
            color: #ececec; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 24px 14px;
        }

        /* Hero Header */
        .hero-title {
            font-family: 'Tiempos Headline', 'Georgia', serif;
            font-size: 2.2rem;
            font-weight: 400;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            color: #ececec;
            text-align: center;
            flex-wrap: wrap;
        }

        .hero-title .asterisk {
            color: #d96e43;
            font-size: 2rem;
            line-height: 1;
        }

        .workspace {
            width: 100%;
            max-width: 760px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Claude Input Card */
        .claude-card {
            background: #201f1d;
            border: 1px solid #32302d;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 56px;
            line-height: 1.5;
        }

        .prompt-input::placeholder {
            color: #6a6865;
        }

        /* Responsive Card Toolbar */
        .card-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* Mode Capsule Pills */
        .mode-capsule {
            background: #141312;
            border-radius: 8px;
            padding: 3px;
            display: flex;
            gap: 2px;
        }

        .capsule-btn {
            background: transparent;
            border: none;
            color: #6a6865;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .capsule-btn.active {
            background: #2d2b28;
            color: #ececec;
        }

        /* Dropdown Selectors */
        .toolbar-select {
            background: #141312;
            border: 1px solid #32302d;
            color: #ececec;
            font-size: 12.5px;
            font-family: inherit;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            padding: 6px 10px;
            border-radius: 8px;
            max-width: 100%;
        }

        .toolbar-select.platform-badge {
            background: #2b231f;
            border-color: #d96e43;
            color: #f5a682;
            font-weight: 600;
        }

        .toolbar-select option {
            background: #201f1d;
            color: #ffffff;
        }

        .send-btn {
            background: #d96e43;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 7px 18px;
            font-size: 13.5px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            margin-left: auto;
        }

        .send-btn:hover {
            background: #c05d34;
        }

        .send-btn:disabled {
            background: #33312e;
            color: #6a6865;
            cursor: not-allowed;
        }

        /* Chat Feed */
        .chat-feed { 
            width: 100%;
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            margin-bottom: 8px;
        }

        .message-row.user {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .message-row.user .bubble {
            background-color: #2b2926;
            border: 1px solid #383531;
            color: #ececec;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-row.ai {
            display: flex;
            justify-content: flex-start;
            width: 100%;
        }

        .message-row.ai .bubble {
            background: transparent;
            color: #d1d0ce;
            padding: 4px 0;
            max-width: 100%;
            font-size: 14px;
            line-height: 1.6;
            white-space: pre-wrap;
            font-family: inherit;
        }

        .message-row.system {
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .message-row.system .bubble {
            background: #18221b;
            color: #4ade80;
            border-left: 3px solid #4ade80;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11.5px;
            width: 100%;
            word-break: break-word;
        }
    </style>
</head>
<body>

<div class="hero-title">
    <span class="asterisk">✴</span> Good afternoon, studatimeYT
</div>

<div class="workspace">
    <div class="chat-feed" id="chatFeed">
        <div class="message-row system">
            <div class="bubble">[SYSTEM]: Ready. Choose target platform below and enter a prompt.</div>
        </div>
    </div>

    <div class="claude-card">
        <textarea id="prompt" class="prompt-input" rows="2" placeholder="How can I help you today?"></textarea>
        
        <div class="card-toolbar">
            <div class="toolbar-group">
                <div class="mode-capsule">
                    <button class="capsule-btn active" id="tabChat" onclick="setExecutionMode('making')">Chat</button>
                    <button class="capsule-btn" id="tabCowork" onclick="setExecutionMode('planning')">Cowork</button>
                </div>

                <select id="edition" class="toolbar-select platform-badge" title="Target Platform">
                    <option value="bedrock">🎮 Bedrock (.mcaddon)</option>
                    <option value="java">☕ Java (Data Pack ZIP)</option>
                </select>
            </div>

            <div class="toolbar-group" style="width: 100%; justify-content: space-between;">
                <select id="model" class="toolbar-select" title="AI Model">
                    <option value="Qwen/Qwen2.5-Coder-32B-Instruct">Sonnet 5 Medium</option>
                    <option value="meta-llama/Llama-3.3-70B-Instruct">Llama 3.3 70B</option>
                </select>

                <button id="pipelineBtn" class="send-btn" onclick="generateMinecraftMod()">Run</button>
            </div>
        </div>
    </div>
</div>

<script>
const PROXY_URL = "https://mcmodai-proxy.open1862.workers.dev";
let currentAiMode = "making";

function setExecutionMode(mode) {
    currentAiMode = mode;
    document.getElementById('tabChat').classList.toggle('active', mode === 'making');
    document.getElementById('tabCowork').classList.toggle('active', mode === 'planning');
}

function appendLog(sender, text) {
    const chatFeed = document.getElementById('chatFeed');
    const row = document.createElement('div');
    row.classList.add('message-row', sender);

    const bubble = document.createElement('div');
    bubble.classList.add('bubble');
    bubble.textContent = sender === 'system' ? `[SYSTEM]: ${text}` : text;

    row.appendChild(bubble);
    chatFeed.appendChild(row);
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}

document.getElementById('prompt').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateMinecraftMod();
    }
});

async function generateMinecraftMod() {
    const edition = document.getElementById('edition').value;
    const modelEndpoint = document.getElementById('model').value;
    const promptText = document.getElementById('prompt').value.trim();
    const pipelineBtn = document.getElementById('pipelineBtn');
    
    if (!promptText) {
        appendLog('system', 'ERROR: Input prompt cannot be empty.');
        return;
    }
    
    pipelineBtn.disabled = true;
    pipelineBtn.textContent = "Building...";
    
    appendLog('user', promptText);
    appendLog('system', `Building in ${currentAiMode === 'making' ? 'Build' : 'Cowork'} mode for ${edition.toUpperCase()}...`);
    
    let systemInstruction = "";
    if (currentAiMode === "planning") {
        systemInstruction = `You are a technical mod designer for Minecraft ${edition}. Create a complete architectural plan for the idea. Format as clean Markdown starting with '# Minecraft Mod Blueprint'.`;
    } else {
        if (edition === "bedrock") {
            systemInstruction = "You are an expert Minecraft Bedrock Add-on developer. Output MUST be a single valid JSON object with two keys: 'manifest' (manifest.json content) and 'logic_js' (main script logic text). Do not include markdown formatting.";
        } else {
            systemInstruction = "You are an expert Minecraft Java data pack generator. Output MUST be a single valid JSON object with two keys: 'pack_mcmeta' (pack.mcmeta content) and 'function_mcfunction' (raw mcfunction commands). Do not include markdown formatting.";
        }
    }

    try {
        const response = await fetch(PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                modelEndpoint: modelEndpoint,
                systemInstruction: systemInstruction,
                promptText: promptText
            })
        });

        const data = await response.json();

        if (data && data.error && data.error.includes("loading")) {
            appendLog('system', 'WARNING: Model initializing on server grid. Retrying in 6s...');
            setTimeout(generateMinecraftMod, 6000);
            return;
        }

        let aiText = "";
        if (data.choices && data.choices[0] && data.choices[0].message) {
            aiText = data.choices[0].message.content;
        } else if (Array.isArray(data) && data[0] && data[0].generated_text) {
            aiText = data[0].generated_text;
        } else if (data && data.generated_text) {
            aiText = data.generated_text;
        } else if (data && data.error) {
            throw new Error(data.error);
        } else {
            throw new Error("Invalid response format received.");
        }

        aiText = aiText.trim();
        appendLog('ai', aiText);

        const zip = new JSZip();
        let downloadName = "";
        let finalBlobContent;

        if (currentAiMode === "planning") {
            appendLog('system', 'Generating markdown blueprint...');
            finalBlobContent = new Blob([aiText], { type: "text/markdown;charset=utf-8" });
            downloadName = "mod_blueprint.md";
        } else {
            appendLog('system', 'Extracting package content...');
            const firstBracket = aiText.indexOf('{');
            const lastBracket = aiText.lastIndexOf('}');

            if (firstBracket === -1 || lastBracket === -1) {
                throw new Error("JSON payload missing from model output.");
            }

            const cleanJsonString = aiText.substring(firstBracket, lastBracket + 1);
            const parsedData = JSON.parse(cleanJsonString);

            if (edition === "bedrock") {
                zip.file("manifest.json", JSON.stringify(parsedData.manifest || {}, null, 4));
                zip.file("main.js", parsedData.logic_js || "// No logic generated");
                downloadName = "custom_addon.mcaddon";
            } else {
                zip.file("pack.mcmeta", JSON.stringify(parsedData.pack_mcmeta || { "pack": { "pack_format": 48, "description": "AI Generated Data Pack" } }, null, 4));
                zip.file("data/custom/functions/main.mcfunction", parsedData.function_mcfunction || "# No command logic generated");
                downloadName = "java_datapack.zip";
            }

            finalBlobContent = await zip.generateAsync({ type: "blob" });
        }

        appendLog('system', `SUCCESS: Downloaded ${downloadName}`);
        
        const link = document.createElement("a");
        link.href = URL.createObjectURL(finalBlobContent);
        link.download = downloadName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    } catch (error) {
        appendLog('system', `ERROR: ${error.message}`);
        console.error(error);
    } finally {
        pipelineBtn.disabled = false;
        pipelineBtn.textContent = "Run";
        document.getElementById('prompt').value = "";
    }
}
</script>

</body>
</html>
