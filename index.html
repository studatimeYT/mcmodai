<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛏️ Orca-Style MC AI Mod Maker</title>
    <!-- Include JSZip to bundle packages inside the browser -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left; margin-bottom: 20px; }
        h2 { text-align: center; color: #ff6f00; margin-top: 0; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #bbb; }
        select, input[type="text"] { width: 100%; padding: 12px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #333; background: #2a2a2a; color: #fff; box-sizing: border-box; font-size: 14px; }
        .radio-group { display: flex; gap: 20px; margin-top: 5px; margin-bottom: 15px; }
        .radio-option { background: #2a2a2a; padding: 12px; border-radius: 4px; border: 1px solid #333; flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .radio-option input { cursor: pointer; }
        button { background-color: #ff6f00; color: white; padding: 14px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { background-color: #e65100; }
        
        /* Orca System Chat Interface Styles */
        .chat-container { max-width: 700px; margin: 0 auto; background: #1e1e1e; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); text-align: left; display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #ff6f00; color: #fff; padding: 12px 20px; font-weight: bold; font-size: 16px; }
        .chat-log { height: 350px; overflow-y: auto; padding: 20px; background: #151515; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 12px 16px; border-radius: 6px; max-width: 85%; line-height: 1.5; word-wrap: break-word; font-size: 14px; }
        .message.user { background: #2a2a2a; color: #fff; align-self: flex-end; border-bottom-right-radius: 0; }
        .message.ai { background: #ff6f0022; color: #fff; align-self: flex-start; border-bottom-left-radius: 0; border-left: 4px solid #ff6f00; white-space: pre-wrap; font-family: 'Courier New', Courier, monospace; }
        .message.system { background: #222; color: #00ff66; align-self: center; font-family: monospace; font-size: 12px; max-width: 95%; text-align: left; border-left: 3px solid #00ff66; width: 100%; padding: 8px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="container">
    <h2>⛏️ Orca-Style MC AI Mod Maker</h2>
    
    <label>1. Select AI Execution Mode:</label>
    <div class="radio-group">
        <div class="radio-option" onclick="document.getElementById('mode_plan').checked=true">
            <input type="radio" id="mode_plan" name="aimode" value="planning" checked>
            <div>
                <strong>Planning Mode</strong><br>
                <small style="color:#888">Generates architecture blueprints (.md)</small>
            </div>
        </div>
        <div class="radio-option" onclick="document.getElementById('mode_make').checked=true">
            <input type="radio" id="mode_make" name="aimode" value="making">
            <div>
                <strong>Making Mode</strong><br>
                <small style="color:#888">Compiles installation assets (.zip)</small>
            </div>
        </div>
    </div>

    <label for="edition">2. Select Minecraft Edition:</label>
    <select id="edition">
        <option value="bedrock">Bedrock Edition (.mcaddon Addon)</option>
        <option value="java">Java Edition (Data Pack / Config Source ZIP)</option>
    </select>

    <label for="model">3. Choose AI Engine:</label>
    <select id="model">
        <option value="Qwen/Qwen2.5-Coder-32B-Instruct">Qwen 2.5 Coder (Fast Generation)</option>
        <option value="meta-llama/Llama-3.3-70B-Instruct">Llama 3.3 70B (Complex Logic)</option>
    </select>

    <label for="prompt">4. Describe Your Mod Idea:</label>
    <input type="text" id="prompt" placeholder="e.g., A ruby pickaxe that creates explosions when mining diamond ore...">
    
    <button onclick="generateMinecraftMod()">Run AI Pipeline</button>
</div>

<!-- Chat Log Dashboard Component -->
<div class="chat-container">
    <div class="chat-header">🤖 Orca Live Pipeline Log Output</div>
    <div class="chat-log" id="chatLog">
        <div class="message system">[SYSTEM]: Core engine listening. Set configurations above and push execution packet...</div>
    </div>
</div>

<script>
function appendLog(sender, text) {
    const chatLog = document.getElementById('chatLog');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.textContent = sender === 'system' ? `[SYSTEM]: ${text}` : text;
    chatLog.appendChild(msgDiv);
    chatLog.scrollTop = chatLog.scrollHeight; // Auto-scroll to bottom
}

async function generateMinecraftMod() {
    const aiMode = document.querySelector('input[name="aimode"]:checked').value;
    const edition = document.getElementById('edition').value;
    const modelEndpoint = document.getElementById('model').value;
    const promptText = document.getElementById('prompt').value;
    
    if (!promptText) {
        appendLog('system', 'ERROR: Input text parameter required.');
        return;
    }
    
    appendLog('user', `[Mode: ${aiMode.toUpperCase()} | Edition: ${edition.toUpperCase()}] ${promptText}`);
    appendLog('system', `Routing compilation packet through CORS security channels...`);
    
    let systemInstruction = "";
    if (aiMode === "planning") {
        systemInstruction = `You are a professional technical designer for Minecraft ${edition} mods. Create a detailed development and architecture plan for the user's idea. Break down the folder structure, listing all necessary files and give an explanation of how to program the logic block-by-block. Output your result directly as a beautiful, comprehensive, clean Markdown text file layout. Do not wrap the output in json or markdown code blocks. Start your response directly with the title '# Minecraft Mod Blueprint'.`;
    } else {
        if (edition === "bedrock") {
            systemInstruction = "You are an expert Minecraft Bedrock Add-on developer. Create an asset bundle for the user. Your output must be a single, valid JSON object containing exactly two keys: 'manifest' (the manifest.json object parameters) and 'logic_js' (the main script logic file string text). Do not include any extra conversational markdown text, descriptions, or formatting backticks.";
        } else {
            systemInstruction = "You are an expert Minecraft Java data pack generator. Create a data pack configuration setup. Your output must be a single, valid JSON object containing exactly two keys: 'pack_mcmeta' (the pack.mcmeta descriptor file) and 'function_mcfunction' (the tick/main game behavior instructions text written in raw standard minecraft commands). Do not include any chat commentary or markdown backticks.";
        }
    }
    
    // Set up endpoint wrapped inside an open CORS proxy pipeline
    const targetUrl = `https://huggingface.co{modelEndpoint}`;
    const proxyUrl = `https://allorigins.win{encodeURIComponent(targetUrl)}`;
    
    try {
        const response = await fetch(proxyUrl, {
            method: "POST",
            body: JSON.stringify({
                inputs: `<|system|>\n${systemInstruction}\n<|user|>\nCreate a ${edition} mod asset package for: ${promptText}\n<|assistant|>\n`,
                parameters: { max_new_tokens: 1200, return_full_text: false }
            })
        });
        
        if (!response.ok) throw new Error("Network pipeline response mismatch.");
        
        const wrapperData = await response.json();
        // Extract out raw network response text
        const rawJsonData = JSON.parse(wrapperData.contents);
        
        if (rawJsonData && rawJsonData.error && rawJsonData.error.includes("loading")) {
            appendLog('system', 'WARNING: AI cluster initializing. Executing automatic server synchronization in 6 seconds...');
            setTimeout(generateMinecraftMod, 6000);
            return;
        }

        let aiText = rawJsonData.generated_text || (Array.isArray(rawJsonData) && rawJsonData[0]?.generated_text);
        if (!aiText && rawJsonData && typeof rawJsonData === 'object') aiText = rawJsonData[0]?.generated_text || JSON.stringify(rawJsonData);
        
        if (!aiText) throw new Error("Empty token buffer layout. Click run again to send clean pulse.");
        aiText = aiText.trim();
        
        // Render text output cleanly inside Orca Chat log
        appendLog('ai', aiText);
        
        const zip = new JSZip();
        let downloadName = "";
        let finalBlobContent;

        if (aiMode === "planning") {
            appendLog('system', 'Compiling raw blueprint structure into markdown stream document data...');
            finalBlobContent = new Blob([aiText], { type: "text/markdown;charset=utf-8" });
            downloadName = "mod_development_plan.md";
        } else {
            appendLog('system', 'Extracting structural blocks out of text content payload array...');
            const firstBracket = aiText.indexOf('{');
            const lastBracket = aiText.lastIndexOf('}');
            if (firstBracket === -1 || lastBracket === -1) {
                throw new Error("Target missing JSON structure wrappers. Re-executing pipeline recommended.");
            }
