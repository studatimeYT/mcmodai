<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mcmodai</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            background-color: #141312; 
            color: #ececec; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Hero Header Matching Screenshot */
        .hero-title {
            font-family: 'Tiempos Headline', 'Georgia', 'Times New Roman', serif;
            font-size: 2.8rem;
            font-weight: 400;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            justify-content: center;
            color: #f0eee9;
            letter-spacing: -0.5px;
        }

        .hero-title .asterisk {
            color: #d96e43;
            font-size: 2.6rem;
            line-height: 1;
        }

        /* Main Workspace Container */
        .workspace {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Claude Pill Input Box Container */
        .claude-card {
            background: #201f1d;
            border: 1px solid #32302d;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .prompt-input {
            width: 100%;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            line-height: 1.5;
        }

        .prompt-input::placeholder {
            color: #6a6865;
        }

        /* Bottom Action Bar */
        .card-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .plus-btn {
            background: transparent;
            border: none;
            color: #8c8883;
            font-size: 20px;
            font-weight: 300;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            line-height: 1;
        }

        .plus-btn:hover {
            color: #ffffff;
        }

        /* Mode Selector Pills */
        .mode-capsule {
            background: #141312;
            border-radius: 8px;
            padding: 3px;
            display: flex;
            gap: 2px;
        }

        .capsule-btn {
            background: transparent;
            border: none;
            color: #6a6865;
            padding: 5px 12px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .capsule-btn.active {
            background: #2d2b28;
            color: #ececec;
        }

        /* Right Actions Toolbar */
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #8c8883;
        }

        .model-picker {
            background: transparent;
            border: none;
            color: #8c8883;
            font-size: 13.5px;
            font-family: inherit;
            cursor: pointer;
            outline: none;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .model-picker:hover {
            color: #ffffff;
        }

        .model-picker option {
            background: #201f1d;
            color: #ffffff;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: #8c8883;
            font-size: 14px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .icon-btn:hover {
            color: #ffffff;
        }

        .send-btn {
            background: #d96e43;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-left: 4px;
            transition: background 0.15s;
        }

        .send-btn:hover {
            background: #c05d34;
        }

        .send-btn:disabled {
            background: #33312e;
            color: #6a6865;
            cursor: not-allowed;
        }

        /* Hidden Platform Settings Drawer */
        .settings-drawer {
            display: none;
            background: #1c1b19;
            border: 1px solid #32302d;
            border-radius: 12px;
            padding: 14px 18px;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .settings-drawer.open {
            display: grid;
        }

        .drawer-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6a6865;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .drawer-select {
            width: 100%;
            background: #252422;
            border: 1px solid #32302d;
            color: #fff;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 13px;
            outline: none;
        }

        /* Output Terminal Log */
        .terminal-box { 
            width: 100%;
            background: #201f1d; 
            border-radius: 12px; 
            border: 1px solid #32302d;
            overflow: hidden; 
        }

        .terminal-header { 
            background: #141312; 
            color: #8c8883; 
            padding: 10px 16px; 
            font-size: 12px; 
            font-weight: 600;
            border-bottom: 1px solid #292825;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #6a6865;
            font-size: 11px;
            cursor: pointer;
        }

        .clear-btn:hover {
            color: #ffffff;
        }

        .terminal-log { 
            height: 180px; 
            overflow-y: auto; 
            padding: 14px; 
            background: #100f0e; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }

        .message { 
            padding: 8px 12px; 
            border-radius: 8px; 
            max-width: 90%; 
            line-height: 1.5; 
            word-wrap: break-word; 
            font-size: 13px; 
        }

        .message.user { 
            background: #d96e43; 
            color: #ffffff; 
            align-self: flex-end; 
        }

        .message.ai { 
            background: #201f1d; 
            color: #ececec; 
            align-self: flex-start; 
            border: 1px solid #32302d;
            white-space: pre-wrap; 
            font-family: 'Courier New', Courier, monospace; 
        }

        .message.system { 
            background: #18221b; 
            color: #4ade80; 
            align-self: center; 
            font-family: monospace; 
            font-size: 11px; 
            width: 100%; 
            border-left: 3px solid #4ade80; 
        }
    </style>
</head>
<body>

<div class="hero-title">
    <span class="asterisk">✴</span> Good afternoon, studatimeYT
</div>

<div class="workspace">
    <div class="claude-card">
        <textarea id="prompt" class="prompt-input" rows="2" placeholder="How can I help you today?"></textarea>
        
        <div class="card-toolbar">
            <div class="toolbar-left">
                <button class="plus-btn" title="Add file">+</button>
                <div class="mode-capsule">
                    <button class="capsule-btn active" id="tabChat" onclick="setExecutionMode('making')">Chat</button>
                    <button class="capsule-btn" id="tabCowork" onclick="setExecutionMode('planning')">Cowork</button>
                </div>
            </div>

            <div class="toolbar-right">
                <select id="model" class="model-picker">
                    <option value="Qwen/Qwen2.5-Coder-32B-Instruct">Sonnet 5 Medium</option>
                    <option value="meta-llama/Llama-3.3-70B-Instruct">Llama 3.3 70B</option>
                </select>
                <button class="icon-btn" title="Voice Input">
                    🎙️ <span style="font-size: 10px; opacity: 0.6;">∨</span>
                </button>
                <button class="icon-btn" onclick="toggleSettings()" title="Settings">⚙️</button>
                <button id="pipelineBtn" class="send-btn" onclick="generateMinecraftMod()">Run</button>
            </div>
        </div>
    </div>

    <div class="settings-drawer" id="settingsDrawer">
        <div class="drawer-group">
            <label for="edition">Target Platform</label>
            <select id="edition" class="drawer-select">
                <option value="bedrock">Bedrock Edition (.mcaddon)</option>
                <option value="java">Java Edition (Data Pack ZIP)</option>
            </select>
        </div>
        <div class="drawer-group">
            <label>Pipeline Mode</label>
            <input type="text" id="selectedModeDisplay" class="drawer-select" value="Chat Mode (Compile .zip assets)" readonly style="opacity: 0.7;">
        </div>
    </div>

    <div class="terminal-box">
        <div class="terminal-header">
            <span>🤖 Build Status Output</span>
            <button class="clear-btn" onclick="clearLog()">Clear Log</button>
        </div>
        <div class="terminal-log" id="chatLog">
            <div class="message system">[SYSTEM]: System idle. Enter mod details above to generate assets...</div>
        </div>
    </div>
</div>

<script>
// YOUR CLOUDFLARE WORKER URL PRE-CONNECTED:
const PROXY_URL = "https://mcmodai-proxy.open1862.workers.dev";
let currentAiMode = "making";

function setExecutionMode(mode) {
    currentAiMode = mode;
    document.getElementById('tabChat').classList.toggle('active', mode === 'making');
    document.getElementById('tabCowork').classList.toggle('active', mode === 'planning');
    document.getElementById('selectedModeDisplay').value = mode === 'making' ? 'Chat Mode (Compile .zip assets)' : 'Cowork Mode (Generate blueprint .md)';
}

function toggleSettings() {
    const drawer = document.getElementById('settingsDrawer');
    drawer.classList.toggle('open');
}

function appendLog(sender, text) {
    const chatLog = document.getElementById('chatLog');
    const msgDiv = document.createElement('div');
    msgDiv.classList.add('message', sender);
    msgDiv.textContent = sender === 'system' ? `[SYSTEM]: ${text}` : text;
    chatLog.appendChild(msgDiv);
    chatLog.scrollTop = chatLog.scrollHeight; 
}

function clearLog() {
    document.getElementById('chatLog').innerHTML = '<div class="message system">[SYSTEM]: Logs cleared. Ready.</div>';
}

document.getElementById('prompt').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generateMinecraftMod();
    }
});

async function generateMinecraftMod() {
    const edition = document.getElementById('edition').value;
    const modelEndpoint = document.getElementById('model').value;
    const promptText = document.getElementById('prompt').value.trim();
    const pipelineBtn = document.getElementById('pipelineBtn');
    
    if (!promptText) {
        appendLog('system', 'ERROR: Input text parameter required.');
        return;
    }
    
    pipelineBtn.disabled = true;
    pipelineBtn.textContent = "Building...";
    
    appendLog('user', `[Mode: ${currentAiMode.toUpperCase()} | Edition: ${edition.toUpperCase()}] ${promptText}`);
    appendLog('system', `Sending packet payload to cloud worker proxy...`);
    
    let systemInstruction = "";
    if (currentAiMode === "planning") {
        systemInstruction = `You are a professional technical designer for Minecraft ${edition} mods. Create a detailed architecture plan for the user's idea. Output your result directly as a clean Markdown layout starting with '# Minecraft Mod Blueprint'.`;
    } else {
        if (edition === "bedrock") {
            systemInstruction = "You are an expert Minecraft Bedrock Add-on developer. Output MUST be a single JSON object with two keys: 'manifest' (manifest.json content) and 'logic_js' (main script logic text). Do not include markdown formatting or extra commentary.";
        } else {
            systemInstruction = "You are an expert Minecraft Java data pack generator. Output MUST be a single JSON object with two keys: 'pack_mcmeta' (pack.mcmeta content) and 'function_mcfunction' (raw mcfunction commands). Do not include markdown formatting or extra commentary.";
        }
    }

    try {
        const response = await fetch(PROXY_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                modelEndpoint: modelEndpoint,
                systemInstruction: systemInstruction,
                promptText: `Create a ${edition} mod asset package for: ${promptText}`
            })
        });

        const data = await response.json();

        if (data && data.error && data.error.includes("loading")) {
            appendLog('system', 'WARNING: Model warming up on cloud grid. Retrying in 6s...');
            setTimeout(generateMinecraftMod, 6000);
            return;
        }

        let aiText = "";
        if (data.choices && data.choices[0] && data.choices[0].message) {
            aiText = data.choices[0].message.content;
        } else if (Array.isArray(data) && data[0] && data[0].generated_text) {
            aiText = data[0].generated_text;
        } else if (data && data.generated_text) {
            aiText = data.generated_text;
        } else if (data && data.error) {
            throw new Error(data.error);
        } else {
            throw new Error("Invalid response payload from API worker.");
        }

        aiText = aiText.trim();
        appendLog('ai', aiText);

        const zip = new JSZip();
        let downloadName = "";
        let finalBlobContent;

        if (currentAiMode === "planning") {
            appendLog('system', 'Saving blueprint stream to markdown file...');
            finalBlobContent = new Blob([aiText], { type: "text/markdown;charset=utf-8" });
            downloadName = "mod_development_plan.md";
        } else {
            appendLog('system', 'Parsing structured asset output...');
            const firstBracket = aiText.indexOf('{');
            const lastBracket = aiText.lastIndexOf('}');

            if (firstBracket === -1 || lastBracket === -1) {
                throw new Error("JSON structure missing. Try a simpler prompt.");
            }

            const cleanJsonString = aiText.substring(firstBracket, lastBracket + 1);
            const parsedData = JSON.parse(cleanJsonString);

            appendLog('system', 'Archiving output assets...');
            if (edition === "bedrock") {
                zip.file("manifest.json", JSON.stringify(parsedData.manifest || {}, null, 4));
                zip.file("main.js", parsedData.logic_js || "// No logic generated");
                downloadName = "custom_addon.mcaddon";
            } else {
                zip.file("pack.mcmeta", JSON.stringify(parsedData.pack_mcmeta || { "pack": { "pack_format": 48, "description": "AI Generated Data Pack" } }, null, 4));
                zip.file("data/custom/functions/main.mcfunction", parsedData.function_mcfunction || "# No command logic generated");
                downloadName = "java_datapack.zip";
            }

            finalBlobContent = await zip.generateAsync({ type: "blob" });
        }

        appendLog('system', `Compilation complete. Downloading: ${downloadName}`);
        
        const link = document.createElement("a");
        link.href = URL.createObjectURL(finalBlobContent);
        link.download = downloadName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        appendLog('system', 'SUCCESS: Build workflow completed.');
    } catch (error) {
        appendLog('system', `ERROR: ${error.message}`);
        console.error(error);
    } finally {
        pipelineBtn.disabled = false;
        pipelineBtn.textContent = "Run";
    }
}
</script>

</body>
</html>
